name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Studio's build, typecheck, and tests need the electron *package*, not
      # its ~100 MB runtime binary. Skipping the download saves that on every
      # OS in the matrix; `pnpm dev` on a developer machine still fetches it.
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # build first: @spectrace/cli resolves @spectrace/core through its
      # published `types` (dist/index.d.ts), which only exists post-build.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      # specs/requirements/ is the single source of truth for requirement
      # title/priority/status; the narrative spec tables are generated from it.
      - run: pnpm spec:index:check
